<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolg API — Group Expense & Debt Minimization System</title>
  <meta name="description" content="RESTful API and web application for group expense tracking, greedy debt minimization, and category analytics.">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <a href="#" class="nav-brand" onclick="showGroupsList(); return false;">
      <span>💎</span>
      <div>
        <span class="brand-badge" data-i18n="appName">Dolg API</span>
        <div class="nav-tagline" data-i18n="tagline">Smart Group Expense Engine</div>
      </div>
    </a>

    <div class="nav-actions">
      <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">🇬🇧 ENG</button>
      <a href="/docs" target="_blank" class="btn btn-secondary btn-sm" data-i18n="navDocs">Swagger API Docs</a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">

    <!-- 1. Authentication View -->
    <div id="authView" class="auth-wrapper" style="display: none;">
      <div class="glass-card">
        <div class="auth-header">
          <h1 data-i18n="authTitle">Welcome to Dolg</h1>
          <p data-i18n="authSubtitle">Sign in or register to manage group expenses effortlessly</p>
        </div>

        <div class="tabs-nav">
          <button id="tabLoginBtn" class="tab-btn active" onclick="showAuthTab('login')" data-i18n="tabLogin">Login</button>
          <button id="tabRegisterBtn" class="tab-btn" onclick="showAuthTab('register')" data-i18n="tabRegister">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label data-i18n="labelEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control" required placeholder="user@example.com">
          </div>
          <div class="form-group">
            <label data-i18n="labelPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="btnLogin">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
          <div class="form-group">
            <label data-i18n="labelName">Full Name</label>
            <input type="text" id="regName" class="form-control" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label data-i18n="labelEmail">Email Address</label>
            <input type="email" id="regEmail" class="form-control" required placeholder="user@example.com">
          </div>
          <div class="form-group">
            <label data-i18n="labelPassword">Password</label>
            <input type="password" id="regPassword" class="form-control" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-success" style="width: 100%;" data-i18n="btnRegister">Create Account</button>
        </form>
      </div>
    </div>

    <!-- 2. Main App View -->
    <div id="appView" style="display: none;">

      <!-- User Bar -->
      <div class="user-bar">
        <div class="user-details">
          <div class="avatar-circle" id="userAvatar">U</div>
          <div>
            <div style="font-weight: 700;" id="userNameDisplay">User Name</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);" id="userEmailDisplay">user@example.com</div>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="logout()" data-i18n="btnLogout">Sign Out</button>
      </div>

      <!-- Groups List Section -->
      <div id="groupsSection">
        <div class="section-header">
          <h2 class="section-title" data-i18n="titleGroups">Your Groups</h2>
          <button class="btn btn-primary" onclick="openCreateGroupModal()" data-i18n="btnCreateGroup">+ Create New Group</button>
        </div>
        <div class="groups-grid" id="groupsGrid"></div>
      </div>

      <!-- Group Dashboard Section -->
      <div id="groupDashboard" style="display: none;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
          <button class="btn btn-secondary btn-sm" onclick="showGroupsList()" data-i18n="btnBackGroups">← Back to Groups</button>
          <button class="btn btn-secondary btn-sm" onclick="openAddMemberModal()" data-i18n="btnAddMember">+ Add Member</button>
        </div>

        <div class="glass-card" style="margin-bottom: 1.5rem;">
          <h2 id="dashGroupName" style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.3rem;">Group Name</h2>
          <p id="dashGroupDesc" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 0.75rem;"></p>
          <div id="dashGroupMembers" style="font-size: 0.85rem; color: var(--primary); font-weight: 600;"></div>
        </div>

        <!-- Dashboard Tabs -->
        <div class="dashboard-nav">
          <button class="dash-tab active" data-tab="expenses" onclick="switchDashTab('expenses')" data-i18n="tabExpenses">Expenses</button>
          <button class="dash-tab" data-tab="balance" onclick="switchDashTab('balance')" data-i18n="tabBalance">Balances & Settle Up</button>
          <button class="dash-tab" data-tab="analytics" onclick="switchDashTab('analytics')" data-i18n="tabAnalytics">Analytics</button>
        </div>

        <div id="dashTabContent"></div>
      </div>

    </div>

  </main>

  <!-- Create Group Modal -->
  <div id="createGroupModal" class="modal-overlay">
    <div class="modal-content glass-card">
      <h3 style="margin-bottom: 1rem;" data-i18n="modalCreateGroupTitle">Create Expense Group</h3>
      <form onsubmit="handleCreateGroup(event)">
        <div class="form-group">
          <label data-i18n="labelGroupName">Group Name</label>
          <input type="text" id="groupNameInput" class="form-control" required data-i18n-ph="phGroupName" placeholder="e.g., Summer Trip">
        </div>
        <div class="form-group">
          <label data-i18n="labelGroupDesc">Description (Optional)</label>
          <input type="text" id="groupDescInput" class="form-control" data-i18n-ph="phGroupDesc" placeholder="Description">
        </div>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeCreateGroupModal()" data-i18n="btnCancel">Cancel</button>
          <button type="submit" class="btn btn-primary" data-i18n="btnSubmitGroup">Create Group</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div id="addMemberModal" class="modal-overlay">
    <div class="modal-content glass-card">
      <h3 style="margin-bottom: 1rem;" data-i18n="btnAddMember">Add Member</h3>
      <form onsubmit="handleAddMember(event)">
        <div class="form-group">
          <label data-i18n="labelEmail">Email Address</label>
          <input type="email" id="memberEmailInput" class="form-control" required data-i18n-ph="phMemberEmail" placeholder="Member's email">
        </div>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeAddMemberModal()" data-i18n="btnCancel">Cancel</button>
          <button type="submit" class="btn btn-primary" data-i18n="btnSubmitMember">Add to Group</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
